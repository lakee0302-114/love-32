name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          npx cap copy android || true

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Love32-Ultra-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Love32-Ultra.apk

      - name: Create GitHub Release with Direct Download APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "Love32 Ultra Android APK v1.0.8 (Seamless Partner Code Pairing & Dual-Mode Connect)"
          body: |
            🚀 Official Android APK Release v1.0.8 for Love32 Ultra!
            
            ### ✨ What's New in v1.0.8:
            - 🔗 **Seamless Real-Time Partner Code Pairing**: Added auto-normalization for codes (supports `LOVE-4634`, `love4634`, or simply `4634`).
            - 🛡️ **Non-Destructive Firebase State Merging**: Preserves both partners' profiles, battery, and live GPS coordinates when pairing.
            - 💖 **Dual-Mode Partner Code Modal**: View and copy your code OR enter your partner's code directly to pair instantly.
            - 📱 **Quick Connect Everywhere**: Enter partner code from Profile screen or Map View directly.
            - 🎨 **Luxury 3D Heart App Launcher Icon & Obsidian Adaptive Theme**.
          files: Love32-Ultra.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
